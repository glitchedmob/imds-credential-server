name: CI

on:
  pull_request:
  push:
    branches: [main, 'sidecar/**']
  schedule:
    - cron: '17 7 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: docker build -t imds-credential-server:ci .
      - run: docker run --rm --read-only --cap-drop=ALL imds-credential-server:ci version
