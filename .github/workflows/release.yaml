name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/glitchedmob/imds-credential-server
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name }}
          provenance: mode=max
          sbom: true
      - name: Add container image links to the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        with:
          script: |
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              { username: context.repo.owner, package_type: 'container', package_name: context.repo.repo, per_page: 100 }
            );
            const links = process.env.IMAGE_TAGS.trim().split('\n').map(image => {
              const tag = image.slice(image.lastIndexOf(':') + 1);
              const version = versions.find(version => version.metadata.container.tags.includes(tag));
              if (!version) throw new Error(`Published container tag not found: ${tag}`);
              return `- [\`${image}\`](${version.html_url})`;
            });
            const { data: release } = await github.rest.repos.getRelease({
              ...context.repo,
              release_id: context.payload.release.id
            });
            const section = [
              '<!-- container-images -->',
              '## Container images',
              '',
              ...links,
              '',
              'Supports `linux/amd64` and `linux/arm64`.',
              '<!-- /container-images -->'
            ].join('\n');
            const body = release.body || '';
            const pattern = /<!-- container-images -->[\s\S]*?<!-- \/container-images -->/;
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              body: pattern.test(body) ? body.replace(pattern, () => section) : [body.trimEnd(), section].filter(Boolean).join('\n\n')
            });
